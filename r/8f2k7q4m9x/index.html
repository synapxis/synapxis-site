<style>

@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Readex+Pro:wght@400;500;600;700&display=swap");

:root {


  --pd-primary-50: #FFF3FA;   --pd-primary-100: #FFC8E2;   --pd-primary-200: #FF8DC4;

  --pd-gray-50: #FAFAFA;
  --pd-gray-100: #F2F2F2;

  --pd-gray-300: #D8D8D8;
  --pd-gray-400: #B3B3B3;
  --pd-gray-500: #999999;
  --pd-gray-600: #808080;
  --pd-gray-700: #676767;

  --pd-pink-500: #FF34A9;  --pd-pink-700: #CC1A85;   --pd-pink-900: #800F54;

  --pd-orange-50: #FFF3EF; --pd-orange-100: #FFCBBA; --pd-orange-200: #FFA182;
  --pd-orange-500: #FF764D; --pd-orange-700: #CC5530; --pd-orange-900: #803318;

  --pd-yellow-50: #FFFDE6; --pd-yellow-100: #FFF6A3; --pd-yellow-200: #FFF060;
  --pd-yellow-500: #FFE900; --pd-yellow-700: #CCB900; --pd-yellow-900: #806F00;

  --pd-lime-50: #EEFDF5;   --pd-lime-100: #B5F6D7;   --pd-lime-200: #7EF1BA;
  --pd-lime-500: #49EDA7;  --pd-lime-700: #28B87A;   --pd-lime-900: #15734C;


  --pd-green-50: #ECFBFD;  --pd-green-100: #ADF0F6;  --pd-green-200: #70E3ED;
  --pd-green-500: #1DD4E3; --pd-green-700: #10A3B2;  --pd-green-900: #086670;

  --pd-blue-50: #ECF6FE;   --pd-blue-100: #A8D9FC;   --pd-blue-200: #60BAF8;
  --pd-blue-500: #039EF5;  --pd-blue-700: #0274B8;   --pd-blue-900: #014A75;

  --pd-purple-50: #F3EEFB; --pd-purple-100: #CDBDEF; --pd-purple-200: #A78DE2;
  --pd-purple-500: #7B5ADC; --pd-purple-700: #5A3CA8; --pd-purple-900: #382368;
}

:root {

  --pd-grad-main: linear-gradient(135deg, #FF34A9, #039EF5);
  --pd-grad-main-light: linear-gradient(135deg, #FFC8E2, #A8D9FC);
  --pd-grad-bar: linear-gradient(to top, #039EF5, #ED19C4);
  --pd-grad-underline: linear-gradient(to right, #039EF5, #FF34A9);
  --pd-grad-btn-hover: linear-gradient(to right, #039EF5, #FF34A9);
}

.pd-h1 { font-family: var(--pd-font-jp); font-size: var(--pd-text-2xl); font-weight: var(--pd-fw-bold);
         line-height: 1.4; }

.pd-h2 { font-family: var(--pd-font-jp); font-size: var(--pd-text-lg); line-height: var(--pd-lh-lg);
         font-weight: var(--pd-fw-bold); }

.pd-h3 { font-family: var(--pd-font-jp); font-size: var(--pd-text-base); line-height: var(--pd-lh-base);
         font-weight: var(--pd-fw-bold); }

.pd-h4 { font-family: var(--pd-font-jp); font-size: var(--pd-text-sm); line-height: var(--pd-lh-sm);
         font-weight: var(--pd-fw-bold); }
.pd-h5 { font-family: var(--pd-font-jp); font-size: var(--pd-text-xs); line-height: var(--pd-lh-xs);
         font-weight: var(--pd-fw-bold); }
.pd-h6 { font-family: var(--pd-font-jp); font-size: var(--pd-text-xs); line-height: var(--pd-lh-xs);
         font-weight: var(--pd-fw-semibold); }
.pd-display { font-family: var(--pd-font-en); font-size: var(--pd-text-4xl); line-height: var(--pd-lh-4xl);
              font-weight: var(--pd-fw-bold); }
.pd-body { font-family: var(--pd-font-jp); font-size: var(--pd-text-sm); font-weight: var(--pd-fw-regular);
           line-height: 2; }
.pd-eyebrow { font-family: var(--pd-font-en); font-size: var(--pd-text-xs); line-height: var(--pd-lh-xs);
              font-weight: var(--pd-fw-semibold); letter-spacing: var(--pd-ls-xs); }
.pd-lead { font-family: var(--pd-font-jp); font-size: var(--pd-text-md); line-height: var(--pd-lh-md);
           font-weight: var(--pd-fw-regular); }
.pd-note { font-family: var(--pd-font-jp); font-size: var(--pd-text-xs); line-height: var(--pd-lh-xs);
           font-weight: var(--pd-fw-regular); }
.pd-link { color: var(--pd-link); text-decoration: underline; }
.pd-link:hover { color: var(--pd-link-hover); }

.pd-link-prose { color: var(--pd-link-prose); text-decoration: underline; }
.pd-link-prose::after { content: "\2197"; margin-left: 2px; }
.pd-link-prose:hover { opacity: .7; }

.pd-strong { font-family: var(--pd-font-jp); font-weight: var(--pd-fw-black); }
.pd-mark { background: var(--pd-mark-bg); font-weight: var(--pd-fw-black); }

:root {

  --pd-font-jp: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                "Yu Gothic", "Segoe UI", sans-serif;
  --pd-font-en: "Readex Pro", "Noto Sans JP", -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;

  --pd-text-4xl:  64px;
  --pd-text-3xl:  48px;
  --pd-text-2xl:  40px;
  --pd-text-xl:   32px;
  --pd-text-lg:   24px;
  --pd-text-md:   20px;
  --pd-text-base: 18px;
  --pd-text-sm:   16px;
  --pd-text-xs:   14px;



  --pd-lh-4xl:  88px;
  --pd-lh-3xl:  72px;
  --pd-lh-2xl:  60px;
  --pd-lh-xl:   48px;
  --pd-lh-lg:   36px;
  --pd-lh-md:   32px;
  --pd-lh-base: 24px;
  --pd-lh-sm:   28px;
  --pd-lh-xs:   24px;



  --pd-ls-3xl:  2.4px;
  --pd-ls-2xl:  2px;
  --pd-ls-xl:   1.6px;
  --pd-ls-lg:   1.2px;
  --pd-ls-md:   1px;
  --pd-ls-base: 0.9px;
  --pd-ls-sm:   0.8px;
  --pd-ls-xs:   0.7px;



  --pd-fw-regular: 400;
  --pd-fw-medium: 500;
  --pd-fw-semibold: 600;
  --pd-fw-bold: 700;
  --pd-fw-black: 800;
}

:root {

--pd-ink-body: var(--pd-gray-800);
  --pd-ink-sub: #8A8A8A;
  --pd-ink-placeholder: var(--pd-gray-500);
  --pd-ink-inv: var(--pd-white);
  --pd-ink-body-inv: var(--pd-gray-300);

  --pd-link: var(--pd-blue-500);
  --pd-link-hover: var(--pd-blue-700);

  --pd-link-prose: #498cde;

  --pd-line-subtle: var(--pd-gray-200);
  --pd-line: var(--pd-gray-300);
  --pd-line-strong: var(--pd-gray-400);
  --pd-line-table: #d2d2d2;
  --pd-mark-bg: linear-gradient(transparent 80%, rgba(124,167,225,.42) 0%);

  --pd-error: #E04545;       --pd-error-bg: #FEF0EF;   --pd-error-ink: #E04545;
  --pd-success: var(--pd-lime-700);     --pd-success-bg: var(--pd-lime-50);   --pd-success-ink: var(--pd-lime-900);
  --pd-warning: var(--pd-yellow-700);   --pd-warning-bg: var(--pd-yellow-50); --pd-warning-ink: var(--pd-yellow-900);
  --pd-info: var(--pd-blue-500);        --pd-info-bg: var(--pd-blue-50);      --pd-info-ink: var(--pd-blue-700);
}

:root {

  --pd-space-1: 4px;   --pd-space-2: 8px;   --pd-space-3: 12px;  --pd-space-4: 16px;
  --pd-space-5: 20px;  --pd-space-6: 24px;  --pd-space-8: 32px;  --pd-space-10: 40px;
  --pd-space-12: 48px; --pd-space-16: 64px; --pd-space-20: 80px;

  --pd-bar-w:       6px;
  --pd-bar-h:      60px;
  --pd-table-pad-y: 10px;

  --pd-radius-sm: 3px;
  --pd-radius-md: 5px;
  --pd-radius-tag: 25px;
  --pd-radius-pill: 999px;

  --pd-shadow-xs: 0 1px 2px rgba(34, 35, 43, .06);
  --pd-shadow-sm: 0 2px 8px rgba(34, 35, 43, .08);
  --pd-shadow-md: 0 6px 20px rgba(34, 35, 43, .10);
  --pd-shadow-lg: 0 16px 40px rgba(34, 35, 43, .12);
  --pd-shadow-pink: 0 8px 24px rgba(255, 52, 169, .28);
  --pd-shadow-blue: 0 8px 24px rgba(3, 158, 245, .26);

  --pd-ease: cubic-bezier(.22, 1, .36, 1);
  --pd-dur: 200ms;
}

.pd-text-center { text-align: center; }

.pd-uppercase { text-transform: uppercase; }

.pd-text-right { text-align: right; }

.pd-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--pd-space-2);
  font-family: var(--pd-font-jp); font-size: var(--pd-text-sm); font-weight: var(--pd-fw-bold);
  line-height: 1; text-decoration: none; cursor: pointer;
  padding: var(--pd-space-3) var(--pd-space-6);
  border: 1px solid transparent; border-radius: var(--pd-radius-pill);
  background: var(--pd-gray-100); color: var(--pd-ink-body);
  transition: background var(--pd-dur) var(--pd-ease), color var(--pd-dur) var(--pd-ease);
}

.pd-btn:hover { background: var(--pd-gray-200); }
.pd-btn--primary { background: var(--pd-primary-700); color: var(--pd-ink-inv); }
.pd-btn--primary:hover { background: var(--pd-grad-btn-hover, var(--pd-primary-700)); }

.pd-btn--secondary { background: var(--pd-secondary-700); color: var(--pd-ink-inv); }
.pd-btn--secondary:hover { background: var(--pd-secondary-900); }
.pd-btn--outline { background: transparent; border-color: var(--pd-line-strong); color: inherit; }
.pd-btn--outline:hover { background: transparent; border-color: var(--pd-primary-700); color: var(--pd-primary-700); }

.pd-btn--ghost { background: transparent; color: var(--pd-link); padding-left: 0; padding-right: 0; }

.pd-btn--ghost:hover { background: transparent; color: var(--pd-link-hover); }

.pd-btn--xs { font-size: var(--pd-text-xs); padding: var(--pd-space-1) var(--pd-space-2); }
.pd-btn--sm { font-size: var(--pd-text-xs); padding: var(--pd-space-2) var(--pd-space-4); }
.pd-btn--lg { font-size: var(--pd-text-md); padding: var(--pd-space-4) var(--pd-space-8); }
.pd-btn--xl { font-size: var(--pd-text-lg); padding: var(--pd-space-5) var(--pd-space-10); }

.pd-btn:disabled, .pd-btn[aria-disabled="true"] { opacity: .45; cursor: default; pointer-events: none; }
.pd-btn:focus-visible { outline: 2px solid var(--pd-secondary-500); outline-offset: 2px; }
.pd-btn:active { transform: translateY(1px); }

.pd-card { background: var(--pd-white); border: 1px solid var(--pd-line-subtle);
           border-radius: var(--pd-radius-md); padding: var(--pd-space-6); }
.pd-card--flat { border: 0; box-shadow: none; }
.pd-card--raised { border: 0; box-shadow: var(--pd-shadow-sm); }
.pd-card--interactive { cursor: pointer; transition: box-shadow var(--pd-dur) var(--pd-ease); }
.pd-card--interactive:hover { box-shadow: var(--pd-shadow-md); }

.pd-badge { display: inline-flex; align-items: center; gap: var(--pd-space-1);
            font-size: var(--pd-text-xs); font-weight: var(--pd-fw-bold); line-height: 1;
            padding: var(--pd-space-1) var(--pd-space-3);
            border-radius: var(--pd-radius-tag);
            background: var(--pd-gray-100); color: var(--pd-ink-body); }
.pd-badge--pink { background: var(--pd-pink-50); color: var(--pd-pink-700); }
.pd-badge--blue { background: var(--pd-blue-50); color: var(--pd-blue-700); }
.pd-badge--purple { background: var(--pd-purple-50); color: var(--pd-purple-700); }
.pd-badge--success { background: var(--pd-success-bg); color: var(--pd-success-ink); }
.pd-badge--warning { background: var(--pd-warning-bg); color: var(--pd-warning-ink); }
.pd-badge--error { background: var(--pd-error-bg); color: var(--pd-error-ink); }

.pd-badge--primary { background: var(--pd-primary-50); color: var(--pd-primary-700); }
.pd-badge--primary-solid { background: var(--pd-primary-700); color: var(--pd-ink-inv); }
.pd-badge--secondary { background: var(--pd-secondary-50); color: var(--pd-secondary-700); }
.pd-badge--secondary-solid { background: var(--pd-secondary-700); color: var(--pd-ink-inv); }

button.pd-badge, a.pd-badge { cursor: pointer; font-family: var(--pd-font-jp); border: 0; }
button.pd-badge:hover, a.pd-badge:hover { box-shadow: inset 0 0 0 1px currentColor; }
button.pd-badge:active, a.pd-badge:active { transform: translateY(1px); }
button.pd-badge:focus-visible,
a.pd-badge:focus-visible { outline: 2px solid var(--pd-secondary-500); outline-offset: 2px; }
button.pd-badge:disabled,
.pd-badge[aria-disabled="true"] { opacity: .45; cursor: default; pointer-events: none; }

.pd-table { width: 100%; border-collapse: collapse; font-size: var(--pd-text-xs); }
.pd-table th, .pd-table td { border: 1px solid var(--pd-line-table); padding: var(--pd-table-pad-y) var(--pd-space-4); text-align: left; }
.pd-table th { background: var(--pd-gray-50); font-weight: var(--pd-fw-bold); }

.pd-table th.pd-text-right,
.pd-table td.pd-text-right { text-align: right; }

.pd-table--head-plain th { background: transparent; }
.pd-table--head-dark th { background: var(--pd-gray-800); color: var(--pd-ink-inv); }

.pd-table--rows tbody tr { transition: background var(--pd-dur) var(--pd-ease); }
.pd-table--rows tbody tr:hover { background: var(--pd-gray-50); }
.pd-table--rows tbody tr[aria-selected="true"] { background: var(--pd-primary-50); }
.pd-table--rows tbody tr[aria-disabled="true"] { opacity: .45; }

.pd-field { display: block; }
.pd-label { display: block; font-family: var(--pd-font-jp); font-size: var(--pd-text-xs);
            font-weight: var(--pd-fw-bold); color: var(--pd-ink-body);
            margin-bottom: var(--pd-space-2); }
.pd-input {
  display: block; width: 100%;
  font-family: var(--pd-font-jp); font-size: var(--pd-text-sm); line-height: 1.5;
  color: var(--pd-ink-body); background: var(--pd-white);
  padding: var(--pd-space-3) var(--pd-space-4);
  border: 1px solid var(--pd-line); border-radius: var(--pd-radius-md);
  transition: border-color var(--pd-dur) var(--pd-ease);
}

.pd-input::placeholder { color: var(--pd-gray-700); }
.pd-input:hover { border-color: var(--pd-line-strong); }
.pd-input:focus { outline: 2px solid var(--pd-secondary-500); outline-offset: 2px; }
.pd-input:disabled { background: var(--pd-gray-50); opacity: .45; cursor: default; }
.pd-input--error { border-color: var(--pd-error); }
.pd-input--sm { font-size: var(--pd-text-xs); padding: var(--pd-space-2) var(--pd-space-3); }
.pd-input--lg { font-size: var(--pd-text-md); padding: var(--pd-space-4) var(--pd-space-5); }

.pd-textarea { min-height: 96px; line-height: 2; resize: vertical; }

.pd-help { display: block; font-family: var(--pd-font-jp); font-size: var(--pd-text-xs);
           color: var(--pd-gray-700); margin-top: var(--pd-space-1); }

.pd-help--error { color: var(--pd-error-ink); }

.pd-alert { display: flex; gap: var(--pd-space-3); padding: var(--pd-space-4);
            border-radius: var(--pd-radius-md); font-size: var(--pd-text-sm);
            line-height: var(--pd-lh-sm);
            background: var(--pd-info-bg); color: var(--pd-ink-body);
            border-left: 3px solid var(--pd-info); }
.pd-alert--success { background: var(--pd-success-bg); border-left-color: var(--pd-success); }
.pd-alert--warning { background: var(--pd-warning-bg); border-left-color: var(--pd-warning); }
.pd-alert--error   { background: var(--pd-error-bg);   border-left-color: var(--pd-error); }

:root{
 --shirabe-ink:#22303F;
 --shirabe-strong:#2E4A63;
 --shirabe-accent:#b08d57;
 --shirabe-accent-strong:#a67c3d;
 --shirabe-line-action:#00CB3D;
 --shirabe-paper:#FAF9F5;
 --shirabe-panel:#F3F0E9;
 --shirabe-ai:var(--shirabe-strong);
 --shirabe-ai-mid:var(--shirabe-accent-strong);
 --shirabe-ai-soft:var(--shirabe-panel);
 --shirabe-brass:var(--shirabe-accent-strong);
 --shirabe-brass-soft:var(--shirabe-accent);
 --navy:var(--shirabe-ai);
 --good:var(--shirabe-ai);
 --bad:var(--shirabe-ai-mid);
 --good-area:var(--shirabe-ai-soft);
 --bad-area:color-mix(in srgb,var(--shirabe-ai-soft) 58%,var(--shirabe-paper));
 --good-catbg:var(--shirabe-ai-soft);
 --bad-catbg:color-mix(in srgb,var(--shirabe-ai-soft) 52%,var(--shirabe-paper));
 --good-pillborder:var(--shirabe-accent);
 --bad-pillborder:var(--shirabe-accent);
 --line:var(--shirabe-accent);
 --line-2:var(--shirabe-accent);
 --line-3:var(--shirabe-panel);
 --ink:var(--shirabe-ink);
 --ink-2:var(--shirabe-ink);
 --ink-3:color-mix(in srgb,var(--shirabe-ink) 78%,var(--shirabe-paper));
 --ink-4:color-mix(in srgb,var(--shirabe-ink) 64%,var(--shirabe-paper));
 --ink-5:color-mix(in srgb,var(--shirabe-ink) 52%,var(--shirabe-paper));
 --ink-6:color-mix(in srgb,var(--shirabe-ink) 38%,var(--shirabe-paper));
 --seg-untouched:var(--shirabe-panel);
 --attr-selbg:var(--shirabe-ai-soft);
 --google:var(--shirabe-strong);
 --amber:var(--shirabe-brass);
 --amber-line:var(--shirabe-brass-soft);
 --beige:var(--shirabe-paper);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
 font-family:var(--pd-font-jp);background:var(--shirabe-paper);color:var(--ink);
 display:flex;align-items:center;justify-content:center;min-height:100vh;
 -webkit-font-smoothing:antialiased;
}
#frame{
 position:relative;width:min(100%,24.375rem);height:46.25rem;
 background:var(--shirabe-paper);border:0;
 border-radius:var(--pd-radius-md);overflow:hidden;box-shadow:var(--pd-shadow-lg);
 display:flex;flex-direction:column;
}
.scrollarea{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.screen{
 display:none;padding:var(--pd-space-6) var(--pd-space-5) var(--pd-space-8);
 min-height:100%;flex-direction:column;
}
.screen.active{display:flex}
.screen[data-kind="select"],
.screen[data-kind="gender"],
.screen[data-kind="age"],
.screen[data-kind="loc"]{padding-bottom:calc(var(--pd-space-20) + var(--pd-space-6))}
#dynScreens{display:contents}
.survey-topic-title{
 margin:0 0 var(--pd-space-3);font-size:var(--pd-text-lg);line-height:var(--pd-lh-lg);
 font-weight:var(--pd-fw-bold);letter-spacing:var(--pd-ls-lg);color:var(--ink)
}
.survey-progress{
 position:sticky;top:0;z-index:3;background:var(--shirabe-paper);
 padding:var(--pd-space-3) var(--pd-space-5) 0;
 margin:calc(var(--pd-space-6)*-1) calc(var(--pd-space-5)*-1) 0;
}
.qprogmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--pd-space-2)}
.qprogmeta .qcaption{font-size:calc(var(--pd-text-xs)*.78);font-weight:var(--pd-fw-medium);color:var(--ink-4)}
.qprogmeta .qcount{font-size:calc(var(--pd-text-xs)*.86);font-weight:var(--pd-fw-semibold);color:var(--navy)}
.progbar{height:var(--pd-space-2);margin-bottom:var(--pd-space-5);overflow:hidden;border-radius:var(--pd-radius-pill);background:var(--seg-untouched)}
.progbar .fill{height:100%;border-radius:inherit;background:var(--navy);transition:width var(--pd-dur) var(--pd-ease)}
.q{font-size:var(--pd-text-sm);font-weight:var(--pd-fw-bold);color:var(--ink);line-height:var(--pd-lh-sm);letter-spacing:var(--pd-ls-sm)}
.qsub{font-size:var(--pd-text-xs);font-weight:var(--pd-fw-regular);color:var(--ink-3);line-height:var(--pd-lh-xs);margin-top:var(--pd-space-2)}

<script>
/* 回答エンジン */
const Engine = (() => {

/* ---------- 状態 ---------- */
const DEV = {};
const state = {
  ratings:{},
  select:{},
  nashi:{},
  single:{},
  text:{},
  comment:'',
  times:{},      // 画面id → {enter, ms}（滞在ミリ秒の累計）
  started:0,
  couponUsed:false, couponSent:false, couponUsedAt:'',
  lottery:'',
  coupon:null,
  flags:{duplicate:false, retry:false, lowConfidence:false},
  device:{token:'', prev:null}
};
let FLOW = null;
let screens = [];
let cur = 0;
const timers = new WeakMap();

/* ---------- ユーティリティ ---------- */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const br  = s => esc(s).replace(/\n/g,'<br>');
const $   = (sel, root=document) => root.querySelector(sel);
const $$  = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const T   = () => Object.assign({rating:2000, select:5000, single:2000, feedback:1800, wait:2200}, FLOW.timing||{});
const isQuestion = sc => ['rating','select','single','dropdown','email','comment'].includes(sc.kind);

function activeScreens(){
  return FLOW.screens.filter(sc => {
    if(!sc.when) return true;
    return DEV[sc.when.dev] === sc.when.is;
  });
}

/* ---------- 端末識別と短期間の重複回答判定 ---------- */
function storeKey(){ return 'xirabe_' + (FLOW.id||'flow'); }
function readStore(){
  let v=null;
  try{ v = localStorage.getItem(storeKey()); }catch(e){}
  if(!v){ try{ const m=document.cookie.match(new RegExp('(?:^|; )'+storeKey()+'=([^;]*)')); if(m) v=decodeURIComponent(m[1]); }catch(e){} }
  try{ return v?JSON.parse(v):null; }catch(e){ return null; }
}
function writeStore(rec){
  const v=JSON.stringify(rec);
  try{ localStorage.setItem(storeKey(), v); }catch(e){}
  try{ document.cookie = storeKey()+'='+encodeURIComponent(v)+'; max-age='+(400*86400)+'; path=/; SameSite=Lax'; }catch(e){}
}
function newToken(){ return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function beginResponse(){
  const dd = FLOW.dedupe||{}; const windowMs = (dd.windowHours||24)*3600*1000;
  const prev = readStore(); const now=Date.now();
  state.device.prev = prev;
  state.device.token = (prev&&prev.token) || newToken();
  state.flags.duplicate = !!(prev && prev.completedAt && now-prev.completedAt < windowMs);
  state.flags.retry     = !!(prev && !prev.completedAt && prev.startedAt && now-prev.startedAt < windowMs);
  state.lottery = state.flags.duplicate ? 'lose' : 'win';
  writeStore({token:state.device.token, startedAt:now, completedAt:null});
}
function finishResponse(){
  const now=Date.now();
  writeStore({token:state.device.token, startedAt:(state.started||now), completedAt:now});
}

/* ---------- 進捗 ---------- */
function progressHTML(sc){
  if(!isQuestion(sc)) return '';
  const qs = screens.filter(isQuestion);
  const total = qs.length, n = qs.indexOf(sc)+1;
  const pct = Math.round(n/total*100);
  const cap = (FLOW.labels&&FLOW.labels.progress) || 'アンケート全体の進捗';
  return `<div class="survey-progress"><div class="qprogmeta"><span class="qcaption">${esc(cap)}</span><span class="qcount">${n}/${total}</span></div>
  <div class="progbar" role="progressbar" aria-label="${esc(cap)}" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${n}"><div class="fill" style="width:${pct}%"></div></div></div>`;
}

function footerHTML(sc, opts={}){
  const back = sc.noBack ? '' : `<button type="button" class="btn-secondary" data-back>戻る</button>`;
  const primary = opts.plain
    ? `<button type="button" class="btn-primary" data-next>${esc(opts.label||'次へ')}</button>`
    : `<button type="button" class="btn-primary timed-next" data-next disabled><span class="next-label">${esc(opts.label||'次へ')}</span></button>`;
  const skip = opts.skip ? `<button type="button" class="btn-secondary survey-action-skip" data-skip style="margin-top:calc(var(--pd-space-2) + var(--pd-space-1))">${esc(opts.skip)}</button>` : '';
  const note = sc.noBack && sc.noBackNote ? `<div class="nobacknote">${esc(sc.noBackNote)}</div>` : '';
  const err = opts.errorSlot ? '<div class="send-error" data-send-error aria-live="polite"></div>' : '';
  return `<div class="survey-action-footer"><div class="survey-action-buttons">${back}${primary}</div>${opts.plain?'':'<div class="countdown-note" aria-live="polite"></div>'}${err}${skip}${note}</div>`;
}

/* ---------- 画面部品 ---------- */
const ICON = {
  chat:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  gift:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>',
  clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  lock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  info:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>',
  up:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11H3V10z"/><path d="M7 10l4-7a2.5 2.5 0 0 1 2.5 2.5V9h5.2a2 2 0 0 1 2 2.3l-1.2 7a2 2 0 0 1-2 1.7H7"/></svg>',
  down:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V3h4v11z"/><path d="M17 14l-4 7a2.5 2.5 0 0 1-2.5-2.5V15H5.3a2 2 0 0 1-2-2.3l1.2-7a2 2 0 0 1 2-1.7H17"/></svg>'
};

function buildWelcome(sc){
  const sub = (sc.subs||[]).map(x=>{
    if(x.type==='org')    return `<div class="org">${esc(x.text)}</div>`;
    if(x.type==='reward') return `<div class="reward">${ICON.gift}${esc(x.text)}</div>`;
    if(x.type==='time')   return `<div class="time">${ICON.clock}${esc(x.text)}</div>`;
    if(x.type==='anon')   return `<div class="anon">${ICON.lock}<div>${esc(x.text)}</div></div>`;
    return '';
  }).join('');
  return `<section class="screen welcome" data-kind="welcome">
    <div class="mark">${ICON.chat}</div>
    <h1>${esc(sc.title)}</h1>
    <p class="lead">${br(sc.lead)}</p>
    ${sub}
    <button type="button" class="btn-primary" style="margin-top:var(--pd-space-2)" data-next>${esc(sc.button||'アンケートを始める')}</button>
  </section>`;
}

function buildRating(sc){
  return `<section class="screen rating-page" data-kind="rating" data-key="${esc(sc.key)}">
    ${progressHTML(sc)}
    <div class="qblock">
      <div class="q">${br(sc.q)}</div>
      <div class="sliderwrap">
        <div class="track" data-key="${esc(sc.key)}" role="slider" aria-label="${esc(sc.q.replace(/\n/g,''))}を0から10で評価" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" tabindex="0">
          <div class="fill"></div>
          <div class="ticks">${Array.from({length:11},(_,i)=>`<span class="tk ${i===5?'mid':''}"></span>`).join('')}</div>
          <div class="thumb">0</div>
        </div>
        <div class="endlabels">
          <div class="e left"><span class="nm">0</span>${esc(sc.left)}</div>
          <div class="e right"><span class="nm">10</span>${esc(sc.right)}</div>
        </div>
      </div>
    </div>
    ${sc.note?`<div class="incentive">${br(sc.note)}</div>`:''}
    ${footerHTML(sc)}
  </section>`;
}

function pillsHTML(items, pos, group){
  const mk = pos==='bad' ? ICON.down : ICON.up;
  return items.map(it=>`<span class="attrbtn survey-choice ${pos}" data-pos="${pos}" data-group="${esc(group)}" data-item="${esc(it.k)}"><span class="box"></span><span class="lb">${esc(it.l)}</span><span class="mk">${mk}</span></span>`).join('');
}
function nashiHTML(group, pos, label, shared){
  return `<div class="nashi ${pos}${shared?' shared':''}" data-nashi="${esc(group)}" data-group="${esc(group)}" data-pos="${pos}"><span class="box"></span><span class="lb">${esc(label||'特になし')}</span></div>`;
}

function buildSelect(sc){
  const blocks = sc.blocks.map((b,bi)=>{
    const g = `${sc.id}_${bi}`;
    let body='';
    if(b.groups){
      body = b.groups.map((gr,gi)=>`<div class="pillhead">${esc(gr.head)}</div><div class="pills" data-unit>${pillsHTML(gr.items,b.pos,g)}</div>`).join('');
    } else {
      body = `<div class="pills" data-unit>${pillsHTML(b.items,b.pos,g)}${sc.nashi==='block'?nashiHTML(g,b.pos,sc.nashiLabel):''}</div>`;
    }
    return `<div class="block" data-group="${esc(g)}">
      <div class="gbhead ${b.pos}"><span class="rule"></span><span class="t">${br(b.title)}<span class="anybadge">いくつでも</span></span></div>
      ${b.sub?`<div class="qsub" style="margin:0 0 var(--pd-space-3)">${esc(b.sub)}</div>`:''}
      <div class="pillarea ${b.pos}">${body}</div>
    </div>`;
  }).join('');
  const shared = sc.nashi==='shared' ? nashiHTML(`${sc.id}_all`,'neutral',sc.nashiLabel,true) : '';
  return `<section class="screen" data-kind="select" data-nashi-mode="${esc(sc.nashi||'block')}">
    ${progressHTML(sc)}
    ${sc.heading?`<div class="survey-topic-title">${esc(sc.heading)}</div>`:''}
    ${blocks}${shared}
    ${footerHTML(sc)}
  </section>`;
}

function buildSingle(sc){
  return `<section class="screen" data-kind="single" data-key="${esc(sc.key)}">
    ${progressHTML(sc)}
    <div class="q">${br(sc.q)}</div>
    ${sc.sub?`<div class="qsub">${esc(sc.sub)}</div>`:''}
    <div class="attrlist" role="radiogroup">${sc.items.map(v=>`<div class="attrbtn" role="radio" aria-checked="false" data-val="${esc(v)}"><span class="lb">${esc(v)}</span></div>`).join('')}</div>
    ${footerHTML(sc)}
  </section>`;
}

function buildComment(sc){
  return `<section class="screen" data-kind="comment">
    ${progressHTML(sc)}
    <div class="q">${br(sc.q)} <span style="font-size:calc(var(--pd-text-xs)*.86);font-weight:var(--pd-fw-regular);color:var(--ink-5)">（任意）</span></div>
    ${sc.sub?`<div class="qsub" style="margin-bottom:var(--pd-space-4)">${esc(sc.sub)}</div>`:''}
    <textarea id="comment" maxlength="${sc.maxlength||500}" placeholder="${esc(sc.placeholder||'')}"></textarea>
    <div class="charcount"><span data-cc>0</span> / ${sc.maxlength||500}</div>
    ${footerHTML(sc,{plain:true,label:sc.doneLabel||'アンケート完了',skip:sc.skipLabel||'',errorSlot:true})}
  </section>`;
}

function buildFeedback(sc){
  return `<section class="screen feedback" data-kind="feedback">
    <div class="circle">✓</div>
    ${sc.step?`<div class="steplbl">${esc(sc.step)}</div>`:''}
    <div class="ack">${br(sc.title)}</div>
    ${sc.body?`<div class="nextbox">${br(sc.body)}</div>`:''}
    <div class="helper" style="margin-top:0">${esc(sc.hint||'まもなく自動で進みます…')}</div>
  </section>`;
}

function buildComplete(sc){
  return `<section class="screen${sc.module==='plain'?' complete-plain':''}" data-kind="complete" data-module="${esc(sc.module)}"><div data-complete-inner></div></section>`;
}

/* ---------- 完了画面 ---------- */
function renderComplete(){
  const sc = screens[cur];
  const inner = $('[data-complete-inner]', screenEl(cur));
  if(!inner) return;
  inner.innerHTML = completePlain(sc);
}

function completePlain(sc){
  const min = Math.max(1, Math.round((Date.now()-state.started)/60000));
  const notes = (sc.notes||[]).filter(n => !n.when || DEV[n.when.dev]===n.when.is).map(n=>`・${esc(n.text||n)}`).join('<br>');
  return `<div class="finish-mark">✓</div>
    <div class="cmpl-h">${esc(sc.title)}</div>
    <div class="cmpl-sub">${esc((sc.sub||'').replace('{min}', String(min)))}</div>
    ${sc.card?`<div class="rcard A"><div class="rmain">${br(sc.card.main)}</div><div class="rsub">${esc(sc.card.sub)}</div></div>`:''}
    ${notes?`<div class="anonbox"><b>${esc(sc.notesTitle||'回答の扱いについて')}</b>${notes}</div>`:''}
    ${sc.closeLabel?`<button type="button" class="btn-secondary" style="margin-top:var(--pd-space-5)" data-close>${esc(sc.closeLabel)}</button>`:''}`;
}

/* ---------- 描画 ---------- */
const BUILD = {welcome:buildWelcome, rating:buildRating, select:buildSelect, single:buildSingle, comment:buildComment, feedback:buildFeedback, complete:buildComplete};

function screenEl(i){ return $(`#dynScreens > .screen[data-idx="${i}"]`); }

function renderAll(){
  screens = activeScreens();
  const html = screens.map((sc,i)=>BUILD[sc.kind](sc).replace('<section ', `<section data-idx="${i}" data-id="${esc(sc.id)}" `)).join('');
  $('#dynScreens').innerHTML = html;
  bindAll();
}

function modalsHTML(){
  const m = FLOW.modals||{};
  const miss = m.missing || {title:'選択されていない\n項目があります', body:'1つ以上お選びください。あてはまらない場合は「特になし」を選んでください。', button:'選択画面に戻る'};
  return `<div class="overlay" id="modal"><div class="modalcard"><div class="micon">${ICON.info}</div>
    <div class="mtitle">${br(miss.title)}</div><div class="mbody">${esc(miss.body)}</div>
    <div class="mbtns"><button type="button" class="btn-primary" id="modalProceed">${esc(miss.button)}</button></div></div></div>`;
}

/* ---------- 遷移 ---------- */
function stamp(id){ const t=state.times[id]; if(t && t.enter){ t.ms=(t.ms||0)+(Date.now()-t.enter); t.enter=0; } }
function goto(i){
  const leaving = screenEl(cur);
  if(leaving) clearTimer(leaving);
  if(screens[cur]) stamp(screens[cur].id);
  cur = i;
  const sc = screens[cur];
  if(!state.times[sc.id]) state.times[sc.id] = {enter:Date.now(), ms:0}; else state.times[sc.id].enter = Date.now();
  $$('#dynScreens > .screen').forEach(s=> s.classList.toggle('active', +s.dataset.idx===cur));
  $('#scrollarea').scrollTop = 0;
  if(cur===0){ state.started=Date.now(); }
  if(sc.kind==='feedback'){ const at=cur; setTimeout(()=>{ if(cur===at) next(); }, T().feedback); }
  if(sc.kind==='complete'){ finishResponse(); renderComplete(); }
}
function next(){ if(cur<screens.length-1) goto(cur+1); }
function prev(){ if(cur>0) goto(cur-1); }
function gotoId(id){ const i=screens.findIndex(s=>s.id===id); if(i>=0) goto(i); }

/* ---------- 自動進行（カウントダウン） ---------- */
function clearTimer(el){ const t=timers.get(el); if(t) cancelAnimationFrame(t); timers.delete(el); }
function startCountdown(el, duration, onDone){
  clearTimer(el);
  const btn=$('[data-next]', el), note=$('.countdown-note', el);
  if(!btn) return;
  const t0=performance.now(); const secs=Math.ceil(duration/1000);
  btn.disabled=false; btn.classList.add('counting'); btn.style.setProperty('--timer-progress','0%');
  if(note) note.textContent=`あと${secs}秒で自動進行`;
  const tick=now=>{
    if(screenEl(cur)!==el) return clearTimer(el);
    const e=Math.min(duration, now-t0), rem=Math.max(0,Math.ceil((duration-e)/1000));
    btn.style.setProperty('--timer-progress',`${e/duration*100}%`);
    if(note) note.textContent = rem>0?`あと${rem}秒で自動進行`:'自動で進みます';
    if(e>=duration){ clearTimer(el); onDone(); return; }
    timers.set(el, requestAnimationFrame(tick));
  };
  timers.set(el, requestAnimationFrame(tick));
}
function resetNext(el, ready, hint){
  clearTimer(el);
  const btn=$('[data-next]', el), note=$('.countdown-note', el);
  if(!btn) return;
  btn.classList.remove('counting'); btn.style.setProperty('--timer-progress','0%'); btn.disabled=!ready;
  if(note) note.textContent = ready?'':(hint||'');
}

/* ---------- 画面ごとの結線 ---------- */
function bindAll(){
  $$('#dynScreens > .screen').forEach(el=>{
    const sc = screens[+el.dataset.idx];
    $$('[data-back]', el).forEach(b=>b.addEventListener('click', ()=>{ clearTimer(el); prev(); }));
    const nextBtn = $('[data-next]', el);
    if(sc.kind==='welcome'){ nextBtn.addEventListener('click', ()=>{ beginResponse(); next(); }); }
    if(sc.kind==='rating') bindRating(el, sc);
    if(sc.kind==='select') bindSelect(el, sc);
    if(sc.kind==='single') bindSingle(el, sc);
    if(sc.kind==='comment') bindComment(el, sc);
  });
  $('#dynScreens').addEventListener('click', e=>{
    const t=e.target.closest('[data-close]'); if(!t) return;
    window.close(); t.textContent='画面を閉じてください';
  });
}

function bindRating(el, sc){
  const track=$('.track',el), fill=$('.fill',track), thumb=$('.thumb',track);
  let active=null;
  const set=v=>{
    const r=Math.max(0,Math.min(10,v)); const pct=((r+.5)/11)*100;
    track.classList.add('touched');
    $$('.tk',track).forEach((t,i)=>t.classList.toggle('selected',i===r));
    track.setAttribute('aria-valuenow',String(r));
    fill.style.width=`${pct}%`; thumb.style.left=`${pct}%`; thumb.textContent=String(r);
    state.ratings[sc.key]=r;
    startCountdown(el, T().rating, next);
  };
  const fromX=x=>{ const rc=track.getBoundingClientRect(); return Math.min(10,Math.floor(Math.max(0,Math.min(1,(x-rc.left)/rc.width))*11)); };
  track.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; active=e.pointerId; track.setPointerCapture(e.pointerId); set(fromX(e.clientX)); });
  track.addEventListener('pointermove',e=>{ if(e.pointerId===active) set(fromX(e.clientX)); });
  track.addEventListener('pointerup',e=>{ if(e.pointerId!==active) return; set(fromX(e.clientX)); active=null; });
  track.addEventListener('pointercancel',e=>{ if(e.pointerId===active) active=null; });
  track.addEventListener('keydown',e=>{
    const v=Number(track.getAttribute('aria-valuenow'));
    if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ e.preventDefault(); set(v-1); }
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){ e.preventDefault(); set(v+1); }
    if(e.key==='Home'){ e.preventDefault(); set(0); } if(e.key==='End'){ e.preventDefault(); set(10); }
  });
  $('[data-next]',el).addEventListener('click',()=>{ clearTimer(el); next(); });
}

function selOf(id){ if(!state.select[id]) state.select[id]=new Set(); return state.select[id]; }
function unitsOf(el){ return $$('[data-unit]', el); }
function unitAnswered(u, el){
  const g = u.closest('.block').dataset.group;
  return !!u.querySelector('.survey-choice.sel') || !!$(`[data-nashi="${CSS.escape(g)}"].checked`, el);
}
function selectReady(el, sc){
  if(sc.nashi==='shared'){ const sh=$('.nashi.shared',el); if(sh&&sh.classList.contains('checked')) return true; return !!$('.survey-choice.sel',el); }
  if(sc.anyOne) return !!$('.survey-choice.sel, [data-nashi].checked', el);
  const us=unitsOf(el); return us.length>0 && us.every(u=>unitAnswered(u,el));
}
function bindSelect(el, sc){
  const sel=selOf(sc.id);
  const refresh=()=>{ const ok=selectReady(el,sc); resetNext(el, ok, '1つ以上選ぶと「次へ」を押せます'); if(ok) startCountdown(el, sc.countdown||T().select, next); };
  $$('.survey-choice',el).forEach(p=>p.addEventListener('click',()=>{
    const key=p.dataset.pos+'§'+p.dataset.item;
    if(sel.has(key)){ sel.delete(key); p.classList.remove('sel'); } else { sel.add(key); p.classList.add('sel'); }
    const n=$(`[data-nashi="${CSS.escape(p.dataset.group)}"]`,el); if(n){ n.classList.remove('checked'); state.nashi[p.dataset.group]=false; }
    const sh=$('.nashi.shared',el); if(sh){ sh.classList.remove('checked'); state.nashi[sh.dataset.nashi]=false; }
    refresh();
  }));
  $$('[data-nashi]',el).forEach(n=>n.addEventListener('click',()=>{
    const now=!n.classList.contains('checked'); n.classList.toggle('checked',now); state.nashi[n.dataset.nashi]=now;
    if(now){
      const scope = n.classList.contains('shared') ? el : n.closest('.block');
      $$('.survey-choice.sel',scope).forEach(p=>{ p.classList.remove('sel'); sel.delete(p.dataset.pos+'§'+p.dataset.item); });
      if(n.classList.contains('shared')) $$('[data-nashi]',el).forEach(o=>{ if(o!==n){ o.classList.remove('checked'); state.nashi[o.dataset.nashi]=false; } });
    }
    refresh();
  }));
  $('[data-next]',el).addEventListener('click',()=>{ if(!selectReady(el,sc)) openModal(); else { clearTimer(el); next(); } });
  resetNext(el, false, '1つ以上選ぶと「次へ」を押せます');
}

function bindSingle(el, sc){
  $$('[data-val]',el).forEach(b=>b.addEventListener('click',()=>{
    $$('[data-val]',el).forEach(x=>{ x.classList.remove('sel'); x.setAttribute('aria-checked','false'); });
    b.classList.add('sel'); b.setAttribute('aria-checked','true');
    state.single[sc.key]=b.dataset.val;
    startCountdown(el, T().single, next);
  }));
  $('[data-next]',el).addEventListener('click',()=>{ clearTimer(el); next(); });
}

/* 自由記述：送信してから完了画面へ進む。失敗時はその場で再送できる */
function bindComment(el, sc){
  const ta=$('textarea',el), cc=$('[data-cc]',el), btn=$('[data-next]',el), err=$('[data-send-error]',el);
  ta.addEventListener('input',()=>{ cc.textContent=ta.value.length; });
  let sending=false;
  btn.addEventListener('click', async ()=>{
    if(sending) return;
    state.comment=ta.value;
    if(typeof window.SUBMIT!=='function'){ next(); return; }
    sending=true; const label=btn.textContent; btn.disabled=true; btn.textContent='送信しています…'; if(err) err.textContent='';
    let r; try{ r = await window.SUBMIT(); }catch(e){ r={ok:false,msg:'送信できませんでした。もう一度お試しください。'}; }
    sending=false; btn.disabled=false; btn.textContent=label;
    if(r && r.ok){ next(); } else if(err){ err.textContent = (r&&r.msg) || '送信できませんでした。もう一度お試しください。'; }
  });
}

function openModal(){ $('#modal').classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); }

/* ---------- キーボード（スマホ）対策 ---------- */
function bindKeyboardInset(){
  const vv=window.visualViewport; if(!vv) return;
  const sync=()=>{ const raw=Math.max(0, window.innerHeight - vv.height - vv.offsetTop); document.documentElement.style.setProperty('--kb-inset', (raw>48?raw:0)+'px'); };
  vv.addEventListener('resize',sync); vv.addEventListener('scroll',sync); sync();
}

/* ---------- 起動 ---------- */
function init(flow){
  FLOW = flow || window.FLOW;
  document.title = FLOW.title || document.title;
  document.body.innerHTML = `<div id="frame"><div class="scrollarea" id="scrollarea"><div id="dynScreens"></div></div>${modalsHTML()}</div>`;
  $('#modalProceed').addEventListener('click', closeModal);
  bindKeyboardInset();
  renderAll();
  goto(0);
}

return {init, state, screens:()=>screens};
})();

    const now = Date.now(), timings = {};
    Object.keys(s.times).forEach(id => { const t = s.times[id]; timings[id] = (t.ms||0) + (t.enter ? now - t.enter : 0); });
    const body = {k, responseId: rid, startedAt: new Date(s.started).toISOString(), submittedAt: new Date(now).toISOString(), answers, timings, ua: navigator.userAgent};
    try{
      const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
      const d = await r.json();
      if(d && d.ok) return {ok:true};
      return {ok:false, msg: reasonText(d && d.reason)};
    }catch(e){
      return {ok:false, msg: reasonText('')};
    }
  }

  if(!/^[0-9a-f]{16}$/i.test(k)){ page('従業員アンケート', 'このURLは使えません。\n案内されたURLをもう一度ご確認ください。'); return; }
  page('従業員アンケート', '読み込んでいます…');
  fetch(API + '?action=info&k=' + encodeURIComponent(k))
    .then(r => r.json())
    .then(d => {
      if(!d || !d.ok){ page('従業員アンケート', reasonText(d && d.reason)); return; }
      const w = window.FLOW.screens.find(s => s.id==='welcome');
      const org = [d.company, d.org].filter(Boolean).join('　');
      if(org) w.subs.unshift({type:'org', text: org});
      window.SUBMIT = submit;
      Engine.init(window.FLOW);
    })
    .catch(() => page('従業員アンケート', '読み込めませんでした。\n電波の良い場所で、ページを読み込み直してください。'));
})();
</script>
</body>
</html>
